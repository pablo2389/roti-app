version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rotiseria_db
    environment:
      POSTGRES_USER: rotiseria
      POSTGRES_PASSWORD: rotiseria
      POSTGRES_DB: rotiseria
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotiseria"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rotiseria_api
    environment:
      DATABASE_URL: postgresql://rotiseria:rotiseria@db:5432/rotiseria
      DEBUG: "False"
      SECRET_KEY: your-secret-key-here
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app/static:/app/app/static
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rotiseria_web
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev

volumes:
  db_data:
