services:
  - type: web
    name: rotiseria-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: starter
    buildCommand: ''
    startCommand: '/app/entrypoint.sh'
    envVars:
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: SECRET_KEY
        value: ${SECRET_KEY}
      - key: PORT
        value: 8000
    healthCheckPath: /docs
    internalPort: 8000
